reverse = "反转所选"
reorder = "移动帧"
duration = "设置时长"
loop = "循环设置"
crop = "裁剪"
resize = "缩放"
rotl = "左旋"
rotr = "右旋"
fliph = "水平翻转"
flipv = "垂直翻转"

# ── 状态栏事件（StatusEvent 翻译） ───────────────────────────────
[status]
ready = "就绪"
loading = "加载中…"
exporting = "导出中…"
dialog_cancelled = "已取消"
cleared = "已清空"
loaded = "已加载：{frames} 帧，{file_bytes}，内存 {mem_bytes}"
