# 注意：不写 _version —— rust-i18n v1 格式 = 每文件一个 locale（取文件名），
# 嵌套表自动展平为点分键（[sidebar] file_info → sidebar.file_info）。

[common]
app_name = "GIFSennin"
loading = "加载中…"
exporting = "导出中…"
cancel = "取消"
confirm = "确认"
apply = "应用"
close = "关闭"

[error]
io = "读写文件失败"
unsupported = "不支持的格式：{0}"
decode = "解码失败"
encode = "编码失败"
too_large = "文件过大：需要 {0}，超出内存预算 {1}"
other = "发生错误"

# ── 编辑命令标签（Edit 变体 → 工具栏/右键菜单） ──────────────────
[edit]
